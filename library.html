<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คลังโครงเอกสาร · FlowDoc</title>
<link rel="stylesheet" href="/ui-colors.css"></head>
<body class="library-gallery">
  <header class="topbar"><a href="library.html" class="brand">▤ <span>FlowDoc</span></a><span class="badge">อ่านอย่างเดียว</span></header>
  <main>
    
    <section class="hero">
      <div><h1>คลังแม่แบบ</h1><p>ค้นหาและเปิดดูโครงเอกสารที่บันทึกไว้</p></div>
      <input type="search" id="search" placeholder="ค้นหาแม่แบบ" aria-label="ค้นหาแม่แบบ">
    </section>
    <section aria-labelledby="catalog-title">
      <div class="toolbar">
        <h2 id="catalog-title">แม่แบบในคลัง <span id="count"></span></h2>
        <div class="controls">
          <button id="create-draft" class="primary" type="button" disabled>＋ สร้างแม่แบบ</button>
          <button id="import-pdf" type="button" aria-haspopup="dialog">Import PDF</button>
          <button id="refresh" type="button">รีเฟรช</button>
        </div>
      </div>
      <p id="status" role="status"></p>
      <div class="cards" id="cards"></div>
    </section>
  </main>
  <dialog id="import-pdf-dialog" aria-labelledby="import-pdf-title">
    <h2 id="import-pdf-title">นำเข้า PDF</h2>
    <div id="import-pdf-drop">
      <p>ลากไฟล์ PDF มาวางที่นี่</p>
      <button id="import-pdf-choose" class="primary" type="button" autofocus>เลือกไฟล์ PDF</button>
      <input id="import-pdf-file" type="file" accept=".pdf,application/pdf" hidden>
    </div>
    <p id="import-pdf-status" role="status"></p>
    <div id="import-pdf-quote" hidden>
      <p id="import-pdf-name"></p>
      <div class="import-pdf-review">
        <section aria-label="ตัวอย่าง PDF">
          <div class="import-pdf-preview-controls">
            <button id="import-pdf-prev" type="button">ก่อนหน้า</button>
            <span id="import-pdf-preview-page" aria-live="polite"></span>
            <button id="import-pdf-next" type="button">ถัดไป</button>
          </div>
          <div id="import-pdf-preview" aria-busy="false">
            <p id="import-pdf-preview-status" role="status"></p>
            <div id="import-pdf-paper"></div>
          </div>
          <label class="import-pdf-include">
            <input id="import-pdf-include" type="checkbox"> รวมหน้านี้
          </label>
        </section>
        <div>
          <label for="import-pdf-pages">หน้าที่ต้องการอ่าน</label>
          <input id="import-pdf-pages" type="text" autocomplete="off" spellcheck="false" aria-describedby="import-pdf-page-hint import-pdf-page-error">
          <p id="import-pdf-page-hint">ระบุเลขหน้าหรือช่วงหน้า เช่น 1, 3-5</p>
          <p id="import-pdf-page-error" role="status" hidden></p>
          <div class="import-pdf-total" role="status">
            <span id="import-pdf-page-count"></span>
            <strong id="import-pdf-credits"></strong>
          </div>
          <p>ราคาทดลอง ระบบยังไม่หักเครดิต</p>
        </div>
      </div>
    </div>
    <form method="dialog">
      <button type="submit">ปิด</button>
      <button type="button" id="import-pdf-confirm" class="primary" disabled>ยืนยันการทดลอง</button>
    </form>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-name">
    <nav class="detail-crumb"><button id="return-library" type="button">← คลังแม่แบบ</button></nav>
    <h2 id="detail-name"></h2>
    <p id="detail-key" hidden></p>
    <p id="detail-info"></p>
    <div id="detail-actions"></div>
    <section id="baseline-controls" aria-label="รุ่นที่ระบบรับงานใช้"></section>
    <form method="dialog"><button autofocus>กลับคลัง</button></form>
  </dialog>
  <script type="module" src="/src/library.ts"></script>
</body>
</html>
